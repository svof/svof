name: test

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Mudlet runs Lua 5.1, so the syntax check has to use 5.1. A newer luac
    # rejects things that are valid here: goto as an identifier, unknown escape
    # sequences such as \w, and assignment rules Penlight relies on.
    - uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.1.5"

    - uses: leafo/gh-actions-luarocks@v4

    - name: install system dependencies
      run: sudo apt-get -y install expat

    - name: install luarocks dependencies
      run: |
        luarocks install luafilesystem
        luarocks install luaexpat

    # The source of truth is src/ now: every .lua file, plus the scripts that
    # have to be inlined into the json because their name cannot be a filename
    # or is shared with a sibling.
    - name: check lua syntax
      run: python3 tools/check_lua_syntax.py --luac "$(which luac)"

    # The module xmls are kept as the reference the conversion is verified
    # against, so they are still worth checking while they are present.
    - name: check reference xml syntax
      run: lua validate-syntax.lua .
