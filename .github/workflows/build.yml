name: build

# The build job runs everywhere, so the conversion can be verified on the pull
# request that proposes it - that verification is the whole point of reviewing
# it. Publishing is a different matter: the release job stays fork-only until
# the converted system has had extended play testing, so nothing here can cut
# an svof release. Drop the `if:` on the release job when that changes.
env:
  # svof cannot be built with upstream muddler. Upstream drops nested group
  # attributes, zeroes multilineDelta, cannot represent a raw keyCode, crashes
  # on colour patterns, mis-orders groups by directory read order, and cannot
  # emit buttons at all - the package it produces looks fine and is silently
  # wrong. All of it is reported: four fixes in muddler PR #57, directory read
  # order in #59, buttons in #60. The fork is needed until those merge.
  MUDDLER_REPO: TheLastDarkthorne/muddler
  # Pinned to a commit rather than to the branch. The artifact users install is
  # built by this tool, so a mutable ref on a personal fork means the thing
  # that built yesterday's package is not necessarily the thing that builds
  # today's. Move it deliberately, in its own commit, and say why.
  # 45616f1 = svof-fixes as of 2026-08-21 (buttons + ActionPackage).
  MUDDLER_REF: 45616f192a938dad0d180b5f8bc406a415efffb7

on:
  push:
    # The syntax and call-site gates used to run on every push, from
    # check-syntax.yml. Folding them in here narrowed that to one branch, which
    # left master and in-client-svof with no check at all.
    branches: [svof-muddler, in-client-svof, master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the built package"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: read the package version
        id: version
        run: |
          version=$(python3 -c "import json;print(json.load(open('mfile'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building svof $version"

      # Gates 1 through 1.3 need only python and lua, so they run BEFORE
      # anything touches gradle, the JDK or the network - folded in after the
      # muddler build, a flaky toolchain took the whole safety net down with it
      # and the run said nothing about whether the source was sound.
      #
      # Mudlet runs Lua 5.1, so the syntax check has to use 5.1. A newer luac
      # rejects things that are valid here: goto as an identifier, unknown
      # escape sequences such as \w, and assignment rules Penlight relies on.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      # Gate 1. Every .lua in src/, plus the 64 scripts inlined into the json.
      # Those are inlined because their name resolves to a filename another
      # item in the same directory also resolves to - 61 share the name
      # outright, 3 differ only in case - so none of them may own the file.
      # Not, as this used to say, because the name cannot be a filename: the
      # names that could not be were renamed instead.
      #
      # --strict-version makes this fail rather than run if the luac on PATH is
      # not 5.1. If the lua action ever changes what it installs, the check
      # would otherwise keep passing while silently validating svof against a
      # grammar Mudlet does not use.
      - name: check lua syntax
        run: |
          # Assigned on its own line so a missing luac fails the step. As
          # "$(which luac)" inline, the command substitution's exit status was
          # discarded, the tool got an empty --luac and silently fell back to a
          # PATH scan - which is the one thing --strict-version exists to stop.
          luac_path="$(which luac)"
          python3 tools/check_lua_syntax.py --luac "$luac_path" --strict-version

      # Gate 1.2. Item names that could not become filenames were renamed, and
      # rename_unfilenameable.py only rewrote the <name> elements - call sites
      # had to be found by hand, and two were missed. Mudlet does not raise on
      # an unknown item name, so both failed silently in play: the enemy list
      # stopped being captured and the elist capture stopped closing early.
      - name: check renamed call sites
        run: python3 tools/check_renamed_callsites.py

      # Gate 1.22. The same shape of silent failure one level down. Almost every
      # trigger is one line calling into svo.valid, which Setup.lua:130 creates
      # as a plain table with no __index, so a name nothing defines raises into
      # the error console and the line the trigger was watching for stops being
      # acted on. Most of those names are not written anywhere as literals -
      # they are generated by loops over affliction lists, so a name is defined
      # if and only if it appears in the right list, and the two files agree by
      # accident rather than by construction. Both halves have already gone
      # wrong: tree_cured_paralysis had a trigger and no list entry, and
      # Zeal's tenderskin trigger called simpletinderskin. The defence handlers
      # in svo.defs are checked the same way: most are generated at
      # systemstart from the records in Defences.lua, and a mistyped one was
      # visible to no gate.
      - name: check svo.valid and svo.defs call sites
        run: python3 tools/check_valid_callsites.py

      # Gate 1.96. Every game line in a defence record becomes a temp trigger
      # at systemstart, exact-match or regex by its key, and three ways of
      # writing one wrong are silent: a regex under an exact-match key, a line
      # with no key, a regex starting with a stray quote. All three are in
      # the 2018 xmls; the ones there today are recorded in the script.
      - name: check the defence records
        run: python3 tools/check_defences.py

      # Gate 1.25. muddler builds from the json and looks for one file per item
      # named after it, so a .lua with no entry there is read by nothing and
      # reported by nothing - and adding an item by creating the file is the
      # obvious move given what the readme says. The same lookup collapses
      # spaces to underscores and is not injective, so two names can silently
      # share one script.
      - name: check the src tree is reachable
        run: python3 tools/check_src_tree.py

      # Gate 1.3. default_prios and ndb-help.lua exist twice: at the repo root,
      # left over from the module era when svo.installationfolder() pointed at
      # the checkout, and in src/resources/, which is what muddler copies into
      # the package and what the system actually reads today. Nothing kept the
      # two in sync. Until the root copies are retired, fail if they drift, so
      # a fix applied to one cannot silently miss the one that ships.
      - name: check the duplicated resource files still match
        run: |
          # Compare content, not raw bytes. default_prios is stored CRLF at
          # the repo root and LF under src/resources/ - a leftover from
          # whenever each copy was last saved, not a real content
          # difference. cmp treated that as a failure the moment this ran
          # anywhere but a Windows checkout, where core.autocrlf silently
          # normalises both copies to CRLF, hiding the exact thing this gate
          # exists to catch.
          for f in default_prios ndb-help.lua; do
            # Both present first. diff of two absent files is a clean pass, so
            # deleting the pair - which loses the copy that actually ships -
            # satisfied a check whose whole subject is those two files.
            for p in "$f" "src/resources/$f"; do
              test -s "$p" || { echo "$p is missing or empty"; exit 1; }
            done
            diff <(tr -d '\r' < "$f") <(tr -d '\r' < "src/resources/$f") || {
              echo "$f differs in content between the repo root and src/resources/ -"
              echo "the src/resources/ copy is the one that ships."
              exit 1
            }
          done

      # Gate 1.5. Logic-level regression test for the six GMCP affliction/
      # defence handlers (Setup.lua) - name parsing, the svoatoss/svodtoss
      # removal gate, the unknownany guard, and once-per-event call counts.
      # Runs the real handler block, extracted from Setup.lua by anchor text,
      # under real Lua 5.1 with a stub svo/sk/conf/gmcp/signals environment.
      # Proves the reconciler logic in isolation; proves nothing about actual
      # play, which still needs the in-game testing in the safety-patch spec.
      - name: test gmcp reconciler logic
        run: lua tools/test_gmcp_reconciler.lua


      # Gate 1.6. svo.lifevision.validate() - that discarding a paragraph as
      # an illusion still records the balance a consumable cure spent. Same
      # extract-the-real-function approach as the gmcp test above.
      - name: test lifevision validate
        run: lua tools/test_lifevision_validate.lua


      # Gate 1.7. codepaste.pyre_holds() - the pyre/burn ladder gating the five
      # burn salves. Same extract-the-real-function approach again. Pins the
      # rung thresholds (they were one too permissive at every level, so svof
      # salved burns pyre restored immediately), the field the level is read
      # from (affs.pyre.count is nil - the entries are {p=, sw=} - and the
      # comparison raised out of an unprotected isadvisable, aborting the whole
      # prompt), and the presence floor for players without GMCP levels.
      - name: test pyre ladder
        run: lua tools/test_pyre_ladder.lua


      # Gate 1.23. presume_cured() - the GMCP gate on the empty-cure sweeps.
      # Every handler in Empty cure handling acts on the inference that a cure
      # which cured nothing means we did not have what it would have cured, and
      # acting on that unconditionally made a wrong name in one of those lists
      # drop an affliction still held. The gate checks Char.Afflictions first.
      # Same extract-the-real-function approach as the three above. Pins that
      # GMCP overrules the inference, that a name GMCP cannot report (the
      # unknowns, blindaff) keeps the old behaviour, that levelled names match
      # through the " (2)" suffix, and that blackout - which stops
      # Char.Afflictions entirely - presumes nothing at all.
      - name: test empty cure gmcp gate
        run: lua tools/test_empty_cure_gate.lua

      # Gate 1.75. latched's entry and its gain-line handler, extracted the
      # same way. Only the gain line may take sip balance: a GMCP List and
      # DIAGNOSE are resyncs, and a GMCP Add can be the game unmasking, after
      # blackout, a latched gained during it.
      - name: test latched
        run: lua tools/test_latched.lua

      # Gate 1.76. svo.focus_would_hurt and what asks it: check_focus, the
      # impatience probe (a bare focus of its own, which must wait while
      # cadmus, fulminated or guilt would punish it) and the login sync that
      # sends the game the focus-with switches. Extracted the same way.
      - name: test focus guards
        run: lua tools/test_focus_guards.lua

      # Gate 1.77. The balances a pear takes, from pressure's entry and
      # empty.eat_pear, extracted the same way. A pear takes smoke balance
      # only when it cures pressure, and none when it cures nothing.
      - name: test pear balance
        run: lua tools/test_pear_balance.lua

      # Gate 1.8. dict_setup decides what a top-level key on an entry means by
      # its TYPE: a table is a balance and gets a name and a priority, a scalar
      # falls through. Both ways of getting that wrong are silent. A scalar
      # named like a balance makes Curing_skeleton.lua:332 index a non-table in
      # the focus pass; a table named like anything else becomes a balance the
      # curing loop can be asked to prioritise. Runs before the single-source
      # work adds any field, because that work adds flat fields to every entry
      # and this is the one way it can break something while nothing yet reads
      # what it added.
      - name: check dictionary entry fields
        run: python3 tools/check_dict_fields.py

      # Gate 1.9. The same affliction fact is written in about ten places, none
      # of them enforced, and four of the nine herb lists in Empty cure
      # handling already disagree with the dictionary's own cure fields. This
      # derives each list from svo.dict and diffs it against the literal
      # holding the same information. Differences that are deliberate live in
      # the baseline with a digest each, so it fails on anything new AND on any
      # change to one already accepted - regenerate with --write-baseline in
      # the same commit that causes it.
      - name: check the derived affliction lists
        run: |
          python3 tools/check_derived_lists.py \
            --baseline tools/derived_lists_baseline.json

      # Gate 1.91. The unknown-affliction count (the ? on the prompt): a
      # defence that absorbs a hidden venom, and the game revealing a hidden
      # affliction over GMCP, each take its ? back off. Runs the real GMCP
      # handlers, lifevision queue, dictionary entries, trigger functions and
      # Penlight's OrderedMap, whose ordering the first of the two hinges on.
      # Every case runs twice, before GMCP is live and with the GMCP gate on.
      - name: test phantom unknowns
        run: lua tools/test_phantom_unknowns.lua

      # Gate 1.92. The tree guard - svof's own strategies don't touch tree when
      # the cures on their way will cure every tree-curable aff, whichever aff
      # the game has each cure take, while the strategies keep deciding
      # everything else. Same extract-the-real-function approach, with cures
      # put on their way through the real doaction and read from the real
      # dictionary. Also a doubled touch: the second touch's off-balance
      # line keeps what the first one found.
      - name: test tree guard
        run: lua tools/test_tree_guard.lua

      # Gate 1.93. Slow curing (aeon, retardation): Action_system's kicks run
      # the current gnome, so svof sends one cure at a time and never denies
      # or pauses for its own commands. Runs the real action system, both
      # gnomes, the batch queue, fancysend, cnrl.processcommand and
      # checkaeony, with a control that puts the old copy back. Also that
      # Action_system logs through the current svo.debugf, and that
      # svo.reset.general keeps the one actions_performed table.
      - name: test slow curing
        run: lua tools/test_slow_curing.lua

      # Gate 1.94. The aff handlers of unweavingbody and crescendo, extracted
      # from the dictionary and run with no global `dict`. Both read one that
      # nothing defines, so gaining either from text or DIAGNOSE raised
      # instead of recording it. Also fails on any other bare `dict.`
      # reference in that file.
      - name: test bare dict references
        run: lua tools/test_bare_dict.lua

      # Gate 1.95. Defences: the records and dictionary entries in every
      # class, the handlers systemstart generates, and what a GMCP gain or
      # loss, a DEF listing and a serverside command do to svof's state.
      # Unlike the extract-the-block suites, this one runs all 23 real
      # loaders through svo_init_system (tools/svof_world.lua), once per
      # class. Several checks pin behaviour that is wrong today, labelled
      # "today", so the commit that fixes one has to change its expectation.
      - name: test defences
        run: lua tools/test_defences.lua

      # Gate 1.97. src/resources/defence_catalog.lua holds every class's
      # version of the defences only some classes have, which svof reads to
      # refuse a definition of one and to copy one into another class, and
      # src/resources/prio_catalog.lua every action with a priority that
      # only some classes have, whose saved places svof keeps. Both are
      # generated by running the real loaders for every class, so this
      # fails when a defence or an action changes and a file doesn't:
      # regenerate them with --write in the same commit.
      - name: check the defence and priority catalogs are current
        run: lua tools/defence_catalog.lua

      # Gate 1.98. svo.prio.insert, which vset calls, in the slow curing list,
      # whose entries are named action_balance. Moving one into a free number
      # indexed the dictionary by the whole name and raised; it splits the
      # name now, as the shuffle onto a taken number already did. In an
      # action's own balance it checked no names and raised on a typo, and in
      # slow curing it took names that aren't cures, such as paranoia_aff; it
      # refuses both now, and vset says why. vswapslow (svo.prio_slowswap)
      # refuses the same names, says the order a swap left in both its lines,
      # and stores a number; and "svo prio changed" is raised once for each
      # entry that moved, not twice, and slow curing events carry the new
      # number, not nil. Runs the real priorities loader,
      # prio_slowswap, the priority snapshots and the vset and vswapslow
      # aliases, with controls that put the old code back.
      - name: test prio insert
        run: lua tools/test_prio_insert.lua

      # Gate 1.994. svo.valid.litpipe, extracted from Main trigger functions:
      # lighting one pipe marks lit the pipe the latest LIGHT named by its
      # ID, and a LIGHT by another name after an older LIGHT <id> marks
      # nothing.
      - name: test litpipe
        run: lua tools/test_litpipe.lua

      # Gate 1.99. src/resources/trigger_catalog.lua holds every line
      # pattern of svof's own triggers, which svof reads to refuse an
      # affliction definition whose line one of them already watches for.
      # It's generated from src/triggers, so this fails when a trigger's
      # patterns change and the file doesn't: regenerate it with --write in
      # the same commit.
      - name: check the trigger catalog is current
        run: python tools/trigger_catalog.py

      # Gate 1.991. Afflictions a player defines: svo.affcures reads the
      # game's Cure(s) text and svo.basicaff builds a dictionary entry from
      # it. Runs the real loaders (tools/svof_world.lua) and checks each built
      # entry against svof's own entry for the same cure.
      - name: test afflictions
        run: lua tools/test_afflictions.lua

      # Gate 1.95. Focus wiring: an affliction's focus block, its name in
      # empty.focuscurables and in the focus_cured_ generator, and its line in
      # the Focus trigger chain, read from the real sources and checked
      # against each other and against the game's Focus Mind list.
      - name: test focus wiring
        run: lua tools/test_focus_wiring.lua

      # Gate 1.96. Waits for afflictions only time cures: each listed
      # entry's customwait against AFFLICTION SHOW's default time, read from
      # the real dictionary.
      - name: test timed waits
        run: lua tools/test_timed_waits.lua

      # Gate 1.992. Writhes and serverside: roped's game name, daeggerimpale's
      # entry, triggers, serverside defaults and priorities, and that every
      # line of the curing code that holds back for an impale holds back for
      # a daegger's too, read from the real sources.
      - name: test writhes
        run: lua tools/test_writhes.lua

      # Gate 1.993. Afflictions svof filed under the wrong name: a Dragoncraft
      # enmeshment is the game's time-cured enmesh, not roped, and GMCP's
      # homunculusmercury is svof's swellskin. Read from the real sources.
      - name: test affliction names
        run: lua tools/test_affliction_names.lua

      # Gate 1.995. Every affliction svof can show on the prompt has a short
      # tag in @affs, and every tag names an affliction, in every class.
      - name: test prompt tags
        run: lua tools/test_prompt_tags.lua

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Resolve the branch to a commit before caching. Keying the cache on the
      # branch name alone would keep serving the jar built from whatever that
      # branch pointed at the first time, so moving the muddler fix forward
      # would silently have no effect here.
      - name: resolve the muddler revision
        id: muddler
        run: |
          if [[ "$MUDDLER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$MUDDLER_REF"
          else
            sha=$(git ls-remote "https://github.com/$MUDDLER_REPO.git" \
                    "refs/heads/$MUDDLER_REF" | cut -f1)
            test -n "$sha" || { echo "no such branch: $MUDDLER_REF"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "muddler $MUDDLER_REF is $sha"

      - name: cache the muddler build
        id: muddler-cache
        uses: actions/cache@v4
        with:
          path: muddler-jar
          key: muddler-${{ env.MUDDLER_REPO }}-${{ steps.muddler.outputs.sha }}

      - name: build muddler from the fork
        if: steps.muddler-cache.outputs.cache-hit != 'true'
        run: |
          git clone "https://github.com/$MUDDLER_REPO.git" muddler-src
          cd muddler-src
          git fetch --depth 1 origin "${{ steps.muddler.outputs.sha }}"
          git checkout --detach "${{ steps.muddler.outputs.sha }}"
          echo "building muddler at $(git rev-parse HEAD)"
          chmod +x gradlew
          ./gradlew --no-daemon shadowJar
          cd ..
          mkdir -p muddler-jar
          cp muddler-src/build/libs/*-all.jar muddler-jar/muddle-all.jar

      - name: report which muddler built the package
        run: echo "package built with muddler ${{ steps.muddler.outputs.sha }}"

      - name: build the package
        run: |
          java -jar muddler-jar/muddle-all.jar
          ls -la build/
          # ls exits 0 on an empty directory, so it never stood in for a check.
          test -s build/svof.mpackage
          test -s build/svof.xml

      # Gate 2. The built package against all 25 original module xmls, object
      # by object: structure, names, scripts, patterns and pattern types, alias
      # regexes, event handlers, behavioural flags and top-level load order.
      #
      # The deliberate differences - the module machinery is gone, the updater
      # and migration guard are new, a few load-order assumptions had to
      # change, and on the branches stacked above this one the GMCP tracking
      # fixes diverge on top - are recorded in the baseline with a digest each,
      # so this fails on anything unexpected AND on any change to one that was
      # already accepted. Structural problems and load
      # order changes are always fatal, baseline or not.
      #
      # The count is deliberately not repeated here. It differs per branch in
      # the stack and rises whenever a file diverges from its 2018 original for
      # the first time, so a number in this comment goes stale by design - it
      # already had, twice. The baseline file holds it and the gate prints it.
      #
      # If a difference here is intended, regenerate the baseline in the same
      # commit that causes it:
      #   python tools/verify_merged.py build/svof.xml \
      #     --write-baseline tools/verify_baseline.json
      - name: verify against the original modules
        run: |
          python3 tools/verify_merged.py build/svof.xml \
            --baseline tools/verify_baseline.json

      # Gate 2.1. Everything above verifies build/svof.xml, which is a sibling
      # of the archive users install rather than the thing itself. This opens
      # the .mpackage: valid zip, every file present and non-empty, its svof.xml
      # byte-identical to the one just verified, and its config.lua parsing as
      # Lua. That last one is not theoretical - muddler writes the README into
      # `description = [[...]]` unescaped, so one `]]` in an example blanks
      # every package field with no error printed anywhere.
      - name: check the package that ships
        run: |
          luac_path="$(which luac)"
          python3 tools/check_package.py --luac "$luac_path"

      # The module xmls are the reference the conversion is verified against,
      # so they are still worth checking while they are present.
      - uses: leafo/gh-actions-luarocks@v4
      - name: install luarocks dependencies
        run: |
          # apt-get update first. The runner image ships a package index that is
          # days to weeks stale, so `install expat` resolves to whatever version
          # that index names and 404s once the mirror has superseded it - which
          # is what happened on 2026-09-24, three weeks after the last green
          # run, on a step no branch had touched.
          sudo apt-get update
          sudo apt-get -y install expat
          luarocks install luafilesystem
          luarocks install luaexpat
      - name: check reference xml syntax
        run: lua validate-syntax.lua .

      - name: upload the package
        uses: actions/upload-artifact@v4
        with:
          name: svof-${{ steps.version.outputs.version }}
          path: |
            build/svof.mpackage
            build/svof.xml
          if-no-files-found: error

  # Only ever runs when a human asks for it from the Actions tab with the
  # release box ticked. Nothing about a push can publish.
  release:
    needs: build
    # Deliberately still fork-only: verifying the conversion is safe to do
    # anywhere, publishing it as an svof release is not, and will not be until
    # play testing says so.
    if: >-
      github.repository == 'TheLastDarkthorne/svof' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: svof-${{ needs.build.outputs.version }}
          path: build

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists - bump the version in mfile first"
            exit 1
          fi
          gh release create "v$VERSION" build/svof.mpackage \
            --title "svof $VERSION" \
            --notes "Install by downloading svof.mpackage and opening it with Mudlet's package manager.

          Built from \`${{ github.sha }}\`."
